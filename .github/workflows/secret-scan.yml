permissions:
  contents: read

name: Secret Scan

on:
  pull_request:
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks workspace scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install gitleaks CLI
        run: |
          set -euo pipefail
          version="8.30.1"
          curl --fail --retry 3 --retry-delay 2 --retry-connrefused -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp
          chmod +x /tmp/gitleaks
          echo "/tmp" >> "$GITHUB_PATH"

      - name: Run gitleaks
        run: gitleaks detect --source . --no-git --config .gitleaks.toml --redact --verbose
